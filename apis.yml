aid: spotpay
name: SpotPay
description: 'SpotPay is a global neobank that operates as a stablecoin-based global bank account,
  letting users hold, send, receive, and spend money anywhere in the world from a single identity-verified
  digital wallet without a traditional bank account. The service settles payments on blockchain rails
  using stablecoins and pairs the wallet with the SpotPay Calypso debit card plus Apple Pay and Google
  Pay support, and lets merchants accept QR-code payments with instant settlement. Founded by Zsika
  Phillip (CEO, ex-Google) and Thomas Cesare-Herriau (CTO, ex-Brex), SpotPay is a Y Combinator Winter
  2026 company operating across 40+ countries and registered as a Money Services Business with FinCEN
  in the United States. As of this enrichment pass SpotPay is a consumer mobile-app product with no
  public API, developer portal, SDKs, or OpenAPI surface; api.spotpay.ai serves only the app''s private
  backend.'
